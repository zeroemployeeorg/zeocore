name: Publish

# Two ways to trigger:
#   1. Push a version tag (`v0.1.0`, matching pyproject.toml's `version`) --
#      publishes straight to real PyPI. This is the release path.
#   2. Manual dispatch (Actions tab -> Run workflow) with a `target` choice
#      of testpypi / pypi / both -- lets a human stage a real publish
#      attempt against TestPyPI (a real, separate package index with its
#      own trusted-publisher binding) without cutting a tag, and is the
#      right way to first verify PyPI's trusted-publisher link is actually
#      configured correctly before it matters on a real release.
#
# Runs the full `make verify` gate first so a broken build can never reach
# either index even if someone tags/dispatches by mistake, then builds
# sdist+wheel once and publishes via PyPI Trusted Publishing (OIDC) to
# whichever index(es) were requested -- no API token stored as a repo
# secret for either index.
#
# One-time setup required on each index's own web UI before this workflow
# can publish there (not done by this workflow, and not something a CI
# session has credentials for):
#   - PyPI:     https://pypi.org/manage/account/publishing/
#   - TestPyPI: https://test.pypi.org/manage/account/publishing/
# For each, register a trusted publisher with EXACTLY:
#   - repository owner: zeroemployeeorg  (moved from profrodai after 0.11.0;
#     a publisher still bound to the old owner fails with invalid-publisher)
#   - repository name:  zeocore
#   - workflow filename: publish.yml  (not the full path, just the filename)
#   - environment name: pypi (for the pypi.org publisher) or
#                        testpypi (for the test.pypi.org publisher)
# All four fields are baked into the OIDC token's claims and must match
# byte-for-byte on PyPI's side -- a mismatch fails with
# "invalid-publisher: valid token, but no corresponding publisher", which
# gives no further detail about WHICH field is wrong, so get all four
# exactly right rather than guessing from the error alone.
# See https://docs.pypi.org/trusted-publishers/.

on:
  workflow_dispatch:
    inputs:
      target:
        description: "Where to publish"
        required: true
        type: choice
        options:
          - testpypi
          - pypi
          - both
        default: testpypi
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: verify before publish
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install uv
        uses: astral-sh/setup-uv@caf0cab7a618c569241d31dcd442f54681755d39 # v3
        with:
          enable-cache: true
          cache-dependency-glob: "pyproject.toml"

      - name: Install Pandoc for real authoring receipt tests
        run: sudo apt-get update && sudo apt-get install -y pandoc

      - name: make setup
        run: make setup

      - name: Check release metadata and tag identity
        run: .venv/bin/python tools/check-release-identity-v1.py

      - name: make verify (the doctrine gate -- must pass before publish)
        run: make verify

  build:
    name: build sdist + wheel
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.built-version.outputs.version }}
      python-floor: ${{ steps.python-floor.outputs.floor }}
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install uv
        uses: astral-sh/setup-uv@caf0cab7a618c569241d31dcd442f54681755d39 # v3
        with:
          enable-cache: true
          cache-dependency-glob: "pyproject.toml"

      - name: make setup
        run: make setup

      - name: make build (python -m build -> sdist + wheel in dist/)
        run: make build

      - name: Read the version this run actually built
        id: built-version
        # Read it from the sdist FILENAME rather than re-parsing
        # pyproject.toml with a second regex -- this is a fact about the
        # artifact that is about to be published, not a re-derivation of
        # one, and it is identical whether this run was triggered by a
        # tag push (ref = refs/tags/vX.Y.Z) or a workflow_dispatch on a
        # branch (ref = refs/heads/main, no version in the ref at all).
        # Exactly one sdist is expected in dist/; fail loudly rather than
        # silently taking the wrong match if that is ever not true.
        run: |
          shopt -s nullglob
          sdists=(dist/*.tar.gz)
          if [ "${#sdists[@]}" -ne 1 ]; then
            echo "::error::expected exactly one sdist in dist/, found ${#sdists[@]}: ${sdists[*]}"
            exit 1
          fi
          filename=$(basename "${sdists[0]}")
          # zeocore-0.6.1.tar.gz -> 0.6.1
          version="${filename#zeocore-}"
          version="${version%.tar.gz}"
          if [ -z "$version" ]; then
            echo "::error::could not extract a version from sdist filename: ${filename}"
            exit 1
          fi
          echo "built version: ${version} (from ${filename})"
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Read the Python floor this version declares
        id: python-floor
        # Same '>=X.Y' shape tests/test_release_consistency.py already
        # assumes and asserts every other floor-bearing file agrees
        # with -- one parse shape, not a second one invented here. The
        # smoke-test job installs on this floor rather than whatever
        # Python the runner defaults to, which is the root cause this
        # job exists to close: a bare `uv venv` on a runner whose default
        # is below the floor lets uv's resolver silently backsolve to an
        # old release instead of failing.
        run: |
          spec=$(grep -E '^requires-python' pyproject.toml | sed -E 's/.*"(.*)"/\1/')
          floor=$(echo "$spec" | sed -E 's/>=([0-9]+\.[0-9]+).*/\1/')
          if ! [[ "$floor" =~ ^[0-9]+\.[0-9]+$ ]]; then
            echo "::error::could not parse a >=X.Y floor out of requires-python = \"${spec}\""
            exit 1
          fi
          echo "python floor: ${floor} (from requires-python = \"${spec}\")"
          echo "floor=${floor}" >> "$GITHUB_OUTPUT"

      - name: Upload build artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish-testpypi:
    name: publish to TestPyPI (trusted publishing)
    needs: build
    if: >-
      (github.event_name == 'workflow_dispatch' &&
       (github.event.inputs.target == 'testpypi' || github.event.inputs.target == 'both'))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment:
      name: testpypi
      url: https://test.pypi.org/project/zeocore/
    permissions:
      id-token: write
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: dist
          path: dist/

      - name: Publish to TestPyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          verbose: true
          print-hash: true

  publish-pypi:
    name: publish to PyPI (trusted publishing)
    needs: build
    if: >-
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) ||
      (github.event_name == 'workflow_dispatch' &&
       (github.event.inputs.target == 'pypi' || github.event.inputs.target == 'both'))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment:
      name: pypi
      url: https://pypi.org/project/zeocore/
    permissions:
      # id-token: write is what makes OIDC / trusted publishing work --
      # no PYPI_API_TOKEN secret needed or wanted.
      id-token: write
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        with:
          verbose: true
          print-hash: true

  smoke-test:
    name: smoke-test the published package
    needs: [build, publish-testpypi, publish-pypi]
    # Runs if EITHER publish job ran and succeeded; skipped entirely (not
    # failed) if a given publish job didn't run because its target wasn't
    # selected -- `always()` plus explicit result checks, since `needs`
    # results for a skipped job read as "success" by default, which would
    # otherwise let this step silently no-op instead of actually verifying
    # anything on a testpypi-only or pypi-only run.
    if: |
      always() &&
      (needs.publish-testpypi.result == 'success' || needs.publish-pypi.result == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      # The version THIS RUN published, read from the built sdist filename
      # (the build job's own output), never from "latest" and never
      # re-derived from the git ref -- a ref alone cannot tell a tag push
      # apart from a workflow_dispatch on main, and "latest on the index"
      # is exactly the hole that let this job install and bless zeocore
      # 0.1.0 on three separate real runs (v0.5.0, v0.6.0, and the
      # 2026-08-31 TestPyPI dispatch) while believing it had verified
      # whatever had just been published.
      EXPECTED_VERSION: ${{ needs.build.outputs.version }}
      PYTHON_FLOOR: ${{ needs.build.outputs.python-floor }}
    steps:
      - name: Check out release examples
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install uv
        uses: astral-sh/setup-uv@caf0cab7a618c569241d31dcd442f54681755d39 # v3

      - name: Fail loudly if the expected version or floor is missing
        run: |
          if [ -z "${EXPECTED_VERSION}" ]; then
            echo "::error::build job produced no version output -- cannot smoke-test without knowing what was published"
            exit 1
          fi
          if [ -z "${PYTHON_FLOOR}" ]; then
            echo "::error::build job produced no python-floor output -- cannot smoke-test without knowing the published floor"
            exit 1
          fi
          echo "expecting zeocore==${EXPECTED_VERSION} on Python >=${PYTHON_FLOOR}"

      - name: Wait for index propagation
        run: sleep 30

      - name: Install from PyPI and smoke-test
        if: needs.publish-pypi.result == 'success'
        run: |
          # Pinned to the FLOOR, never a bare `uv venv` -- a bare venv
          # takes the runner's default interpreter (3.12 on
          # ubuntu-latest today), which is BELOW every floor zeocore has
          # ever shipped except 0.1.0's, so an unpinned interpreter lets
          # uv's resolver silently backsolve to the oldest release that
          # still satisfies 3.12 instead of failing outright. That
          # silent backsolve is the exact defect this job exists to
          # catch, so the job's own interpreter must not be capable of
          # triggering it.
          uv venv --python "${PYTHON_FLOOR}" /tmp/smoke-pypi
          # Pinned to the exact version this run published, never
          # unpinned/"latest" -- see EXPECTED_VERSION's comment above.
          uv pip install --python /tmp/smoke-pypi/bin/python --no-cache "zeocore==${EXPECTED_VERSION}"
          /tmp/smoke-pypi/bin/python -c "
          import sys
          import zeo_core
          expected = '${EXPECTED_VERSION}'
          installed = zeo_core.__version__
          print('expected version:', expected)
          print('installed version:', installed)
          if installed != expected:
              print(f'MISMATCH: this run published {expected} but the index installed {installed} -- DO NOT trust this release', file=sys.stderr)
              sys.exit(1)
          from zeo_core.tools import BaseZeoTool, ToolContext
          from zeo_core.contracts import CapabilityResult
          from zeo_core.integrations.hosted import ServiceResolver, ExecutionProfile
          from zeo_core.integrations.hubspot import HubSpotIntegration
          from zeo_core.integrations.kit import KitIntegration
          from zeo_core.integrations.gemini import ImageGenerationRequest
          from zeo_core.integrations.environments import IntegrationEnvironment
          print('import OK: authoring, native profiles, marketing, Gemini and environments')
          print('SMOKE TEST PASSED: zeocore==' + installed + ' installs and imports on the published floor')
          "
          uv pip install --python /tmp/smoke-pypi/bin/python --no-cache \
            --default-index https://pypi.org/simple/ "zeocore[runtime-host]==${EXPECTED_VERSION}"
          /tmp/smoke-pypi/bin/python examples/runtime_host_catalogue_v1.py
          /tmp/smoke-pypi/bin/python examples/meeting_request_v1.py
          /tmp/smoke-pypi/bin/python -c "
          import json
          import subprocess
          result = subprocess.run(['/tmp/smoke-pypi/bin/zeo-capability', 'invoke'], capture_output=True, text=True)
          assert result.returncode == 8, result
          envelope = json.loads(result.stdout)
          assert envelope['state'] == 'protocol_error', envelope
          assert envelope['error_code'] == 'ZEO_HOST_PROTOCOL', envelope
          assert envelope['binding'] is None and envelope['artifact_refs'] == [], envelope
          print('Runtime CLI refuses invocation without launch authority')
          "

      - name: Install from TestPyPI and smoke-test
        if: needs.publish-testpypi.result == 'success' && needs.publish-pypi.result != 'success'
        run: |
          uv venv --python "${PYTHON_FLOOR}" /tmp/smoke-testpypi
          curl --fail --silent --show-error \
            "https://test.pypi.org/pypi/zeocore/${EXPECTED_VERSION}/json" \
            --output /tmp/zeocore-testpypi.json
          wheel_url=$(/tmp/smoke-testpypi/bin/python -c "
          import json
          data = json.load(open('/tmp/zeocore-testpypi.json'))
          expected = 'zeocore-${EXPECTED_VERSION}-py3-none-any.whl'
          matches = [item['url'] for item in data['urls'] if item['filename'] == expected]
          if len(matches) != 1:
              raise SystemExit(f'expected exactly one {expected}, found {len(matches)}')
          print(matches[0])
          ")
          case "${wheel_url}" in
            https://test-files.pythonhosted.org/*/zeocore-${EXPECTED_VERSION}-py3-none-any.whl) ;;
            *) echo "::error::unexpected TestPyPI wheel URL: ${wheel_url}"; exit 1 ;;
          esac
          # Address the staged ZeoCore wheel directly and resolve its
          # dependencies only from PyPI. uv's safe first-index strategy makes
          # --index-url/--extra-index-url unsuitable here: PyPI can hide the
          # staged ZeoCore version, while reversing the indexes lets stale or
          # hostile TestPyPI dependency names hide valid PyPI dependencies.
          uv pip install --python /tmp/smoke-testpypi/bin/python --no-cache \
            --default-index https://pypi.org/simple/ \
            "${wheel_url}"
          /tmp/smoke-testpypi/bin/python -c "
          import sys
          import zeo_core
          expected = '${EXPECTED_VERSION}'
          installed = zeo_core.__version__
          print('expected version:', expected)
          print('installed version:', installed)
          if installed != expected:
              print(f'MISMATCH: this run published {expected} but the index installed {installed} -- DO NOT trust this release', file=sys.stderr)
              sys.exit(1)
          from zeo_core.tools import BaseZeoTool, ToolContext
          from zeo_core.contracts import CapabilityResult
          from zeo_core.integrations.hosted import ServiceResolver, ExecutionProfile
          from zeo_core.integrations.hubspot import HubSpotIntegration
          from zeo_core.integrations.kit import KitIntegration
          from zeo_core.integrations.gemini import ImageGenerationRequest
          from zeo_core.integrations.environments import IntegrationEnvironment
          print('import OK: authoring, native profiles, marketing, Gemini and environments')
          print('SMOKE TEST PASSED: zeocore==' + installed + ' installs and imports on the published floor')
          "
          uv pip install --python /tmp/smoke-testpypi/bin/python --no-cache \
            --default-index https://pypi.org/simple/ "zeocore[runtime-host] @ ${wheel_url}"
          /tmp/smoke-testpypi/bin/python examples/runtime_host_catalogue_v1.py
          /tmp/smoke-testpypi/bin/python examples/meeting_request_v1.py
          /tmp/smoke-testpypi/bin/python -c "
          import json
          import subprocess
          result = subprocess.run(['/tmp/smoke-testpypi/bin/zeo-capability', 'invoke'], capture_output=True, text=True)
          assert result.returncode == 8, result
          envelope = json.loads(result.stdout)
          assert envelope['state'] == 'protocol_error', envelope
          assert envelope['error_code'] == 'ZEO_HOST_PROTOCOL', envelope
          assert envelope['binding'] is None and envelope['artifact_refs'] == [], envelope
          print('Runtime CLI refuses invocation without launch authority')
          "

  # --------------------------------------------------------------------------
  # Create the GitHub Release from RELEASE_NOTES.md.
  #
  # Without this job the workflow publishes to PyPI and leaves the repo's
  # Releases page showing the PREVIOUS version -- which is exactly what
  # happened on v0.6.0: the package was installable from PyPI while
  # /releases still read 0.5.0, because "published to the index" and
  # "announced on the repo" are two different acts and only the first was
  # automated. Nobody should have to remember the second one.
  #
  # Tag-triggered only: a workflow_dispatch has no tag to attach a release
  # to. `contents: write` is scoped to THIS job rather than raised on the
  # whole workflow, which otherwise runs read-only.
  # --------------------------------------------------------------------------
  github-release:
    name: create the GitHub Release
    needs: [publish-pypi, smoke-test]
    if: >-
      always() && needs.publish-pypi.result == 'success' &&
      needs.smoke-test.result == 'success' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Fail loudly if RELEASE_NOTES.md is missing
        run: |
          if [ ! -f RELEASE_NOTES.md ]; then
            echo "::error::RELEASE_NOTES.md not found -- refusing to publish an"
            echo "::error::empty GitHub Release. The package is already on PyPI;"
            echo "::error::create the release by hand and fix this file."
            exit 1
          fi

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          echo "Creating GitHub Release for ${TAG} from RELEASE_NOTES.md"
          gh release create "${TAG}" \
            --repo "${GITHUB_REPOSITORY}" \
            --title "zeocore ${TAG#v}" \
            --notes-file RELEASE_NOTES.md \
            --verify-tag
