name: Documentation

on:
  push:
    branches: [main]
    paths: ["docs/**", "examples/**", "src/**", "*.md", "mkdocs.yml", "pyproject.toml", "uv.lock", "tools/mkdocs_hooks_v1.py", "tests/docs_site/**", "Makefile", ".github/workflows/docs.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: documentation-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Build-only: runs on pull requests and on main with a read-only token.
  documentation:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
          python-version: "3.14"
      - name: Install the locked documentation toolchain
        run: uv sync --frozen --only-group documentation
      - name: Build and validate documentation
        run: make docs-build

  # Publish: main only, after the build job passes. The write permissions
  # live on this job alone.
  publish:
    needs: documentation
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    # The Pages wait below polls for up to five minutes.
    timeout-minutes: 10
    permissions:
      contents: write
      pages: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
          python-version: "3.14"
      - name: Install the locked documentation toolchain
        run: uv sync --frozen --only-group documentation
      - name: Publish to gh-pages
        run: uv run --no-sync mkdocs gh-deploy --strict
      - name: Request the Pages build explicitly
        env:
          GH_TOKEN: ${{ github.token }}
        # GITHUB_TOKEN pushes do not themselves trigger a Pages build.
        run: |
          expected=$(git ls-remote origin refs/heads/gh-pages | cut -f1)
          test -n "$expected"
          gh api --method POST "repos/${GITHUB_REPOSITORY}/pages/builds"
          # A Pages build can report "errored" for a commit that builds fine a
          # moment later (0.55.4's run failed four seconds after the push, and the
          # site was current afterwards). So an errored build is requested again,
          # up to three requests in all, before the step fails. Each errored build
          # is counted once, by its updated_at, because "latest" keeps showing it
          # until the new build starts.
          requests=1
          last_errored=""
          for attempt in $(seq 1 60); do
            gh api "repos/${GITHUB_REPOSITORY}/pages/builds/latest" > /tmp/pages-build.json
            commit=$(jq -r .commit /tmp/pages-build.json)
            status=$(jq -r .status /tmp/pages-build.json)
            if [ "$commit" = "$expected" ]; then
              if [ "$status" = built ]; then exit 0; fi
              if [ "$status" = errored ]; then
                stamp=$(jq -r .updated_at /tmp/pages-build.json)
                if [ "$stamp" != "$last_errored" ]; then
                  last_errored="$stamp"
                  jq .error /tmp/pages-build.json
                  if [ "$requests" -ge 3 ]; then exit 1; fi
                  requests=$((requests + 1))
                  sleep 10
                  # A Pages build request names no commit, so check that the
                  # branch still holds the commit this run published before asking.
                  tip=$(git ls-remote origin refs/heads/gh-pages | cut -f1)
                  if [ "$tip" != "$expected" ]; then
                    echo "::error::gh-pages moved to ${tip} after ${expected}; no build is requested for another commit"
                    exit 1
                  fi
                  gh api --method POST "repos/${GITHUB_REPOSITORY}/pages/builds"
                fi
              fi
            fi
            sleep 5
          done
          echo "::error::Pages did not publish the expected gh-pages commit within five minutes"
          exit 1
