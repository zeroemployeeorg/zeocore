# zeocore/pyproject.toml
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "zeocore"
version = "0.12.0"
description = "Typed capability-authoring framework for Python — contracts, @capability tools, and adapters"
keywords = [
    "automation",
    "capabilities",
    "content-creation",
    "media-production",
    "tools",
    "workflows",
]
readme = "README.md"
requires-python = ">=3.14"
license = { text = "MIT" }
authors = [
    { name = "Rod Rivera", email = "rod@aiproduct.engineer" }
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "pydantic>=2.6.0",
    "pyyaml>=6.0.1",
    "rich>=13.6.0",
    "tqdm",
    "Jinja2",
    "pydantic[email]",
    # RULING-407 item 4 (zeocore org corpus, 2026-08-31): .env.example has
    # always documented `.env` as "the documented home for secrets in
    # ZeoCore," but nothing loaded it -- python-dotenv makes that real via
    # zeo_core.config.load_dotenv_file(). Core, not an extra: every
    # integration reads its own secrets from os.environ, not just Google's.
    "python-dotenv>=1.0.0",
    # Native ZEOconnect transport: normal installs are connection-ready, but
    # importing and local resolution remain zero-network.
    "httpx>=0.27",
]

[project.scripts]
zeo-capability = "zeo_core.adapters.runtime_host.__main__:main"

[project.optional-dependencies]
# HTTP Adapter dependencies
http = [
    "fastapi>=0.112",
    "uvicorn[standard]>=0.30",
    "pydantic>=2"
]
http-dev = [
    "fastapi>=0.112",
    "uvicorn[standard]>=0.30",
    "pydantic>=2",
    "pytest-asyncio>=0.21"
]
# MCP Adapter dependencies.
# Pinned to the 2.x line deliberately, not left to "whatever `pip install
# mcp` resolves today": mcp's own package README states `pip install mcp`
# installs 2.x by default as of the 2026-07-28 MCP spec, that 2.x is a
# from-scratch rework of 1.x's API (mcp.server.fastmcp.FastMCP is gone;
# mcp.server.MCPServer replaces it), and that callers not yet migrated
# should pin `<2`. zeocore is new (0.1.0, beta) with zero existing MCP
# callers to break, so it targets the actively-developed 2.x line rather
# than the legacy-maintenance-only 1.x branch.
mcp = [
    "mcp>=2.0.0,<3",
]
mcp-dev = [
    "mcp>=2.0.0,<3",
    "pytest-asyncio>=0.21",
]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=7.1",
    "ruff>=0.2.0",
    "mypy>=1.8.0",
    "isort",
    "hatchling",
    "build>=1.0.0",
    "black>=23.0.0",
    "hypothesis",
    "python-docx",
    "types-PyYAML",
    "coverage>=7.10",
]
lint = [
    # Tier-1 architecture linters (Master ruling: dedicated .[lint] extra).
    # import-linter enforces the directional import contracts in .importlinter.
    "import-linter>=2.5",
]
# All four Google-family extras below share `platformdirs`: RULING-408
# (DESIGN-01 approach C) computes the credentials/client-secret default
# location through it (zeo_core.integrations.google.credential_paths),
# and that module is imported unconditionally by google/config.py and
# google/auth.py -- shared by drive, mail (the `gmail` extra), and calendar.
gmail = [
    "google-api-python-client>=2.0.0",
    "google-auth-httplib2>=0.1.0",
    "google-auth-oauthlib>=0.4.0",
    "platformdirs>=4.0.0",
]
notion = [
    "notion-client>=3.1.0",
]
supabase = [
    "supabase>=2.31.0,<3",
]
google = [
    "google-api-python-client>=2.0.0",
    "google-auth-httplib2>=0.1.0",
    "google-auth-oauthlib>=0.4.0",
    "platformdirs>=4.0.0",
]
# Connector-name aliases for the shared Google Workspace dependency family.
# `google` is the canonical umbrella extra; these keep direct installs legible.
docs = [
    "google-api-python-client>=2.0.0",
    "google-auth-httplib2>=0.1.0",
    "google-auth-oauthlib>=0.4.0",
    "platformdirs>=4.0.0",
]
sheets = [
    "google-api-python-client>=2.0.0",
    "google-auth-httplib2>=0.1.0",
    "google-auth-oauthlib>=0.4.0",
    "platformdirs>=4.0.0",
]
slides = [
    "google-api-python-client>=2.0.0",
    "google-auth-httplib2>=0.1.0",
    "google-auth-oauthlib>=0.4.0",
    "platformdirs>=4.0.0",
]
drive = [
    "google-api-python-client>=2.0.0",
    "google-auth-httplib2>=0.1.0",
    "google-auth-oauthlib>=0.4.0",
    "platformdirs>=4.0.0",
]
calendar = [
    "google-api-python-client>=2.0.0",
    "google-auth-httplib2>=0.1.0",
    "google-auth-oauthlib>=0.4.0",
    "platformdirs>=4.0.0",
]
youtube = [
    "google-api-python-client>=2.0.0",
    "google-auth-httplib2>=0.1.0",
    "google-auth-oauthlib>=0.4.0",
    "platformdirs>=4.0.0",
    # google.auth.transport.requests.AuthorizedSession opens upload sessions.
    "requests",
]
pandoc = ["pypandoc", "beautifulsoup4"]
llms = ["tiktoken", "openai", "anthropic"]
github = ["requests"]
# `platformdirs` here for the same reason the four Google-family extras
# above declare it: BlueskyConfigProvider/BlueskyAuthProvider resolve their
# default credentials path through it unconditionally
# (zeo_core.integrations.social.bluesky.credential_paths), same computation,
# same shared per-user root.
bluesky = ["requests", "platformdirs>=4.0.0"]
ffmpeg = ["ffmpeg-zeo>=0.1.0"]
# Local Revolut Business enrollment: client key, certificate and RS256 assertion.
# The read client itself needs no extra.
revolut = ["cryptography>=45", "platformdirs>=4.0.0"]
# GitHub App installation tokens for an isolated principal (the merger): RS256 App JWT.
github-app = ["cryptography>=45"]
jupytext = ["jupytext>=1.16.0", "nbformat>=5.10.0"]
notebook = ["nbclient>=0.11,<0.12", "ipykernel>=7.3,<8", "psutil>=7.2,<8"]
all = [
    "nbclient>=0.11,<0.12",
    "ipykernel>=7.3,<8",
    "psutil>=7.2,<8",
    "google-api-python-client>=2.0.0",
    "google-auth-httplib2>=0.1.0",
    "google-auth-oauthlib>=0.4.0",
    "platformdirs>=4.0.0",
    "notion-client>=3.1.0",
    "supabase>=2.31.0,<3",
    "pypandoc",
    "beautifulsoup4",
    "tiktoken",
    "openai",
    "anthropic",
    "jupytext>=1.16.0",
    "nbformat>=5.10.0",
    "requests",
    "ffmpeg-zeo>=0.1.0",
    "cryptography>=45",
]
runtime-host = [
    "jsonschema==4.26.0",
    "rfc8785==0.1.4",
]

[project.urls]
"Homepage" = "https://github.com/zeroemployeeorg/zeocore"
"Bug Tracker" = "https://github.com/zeroemployeeorg/zeocore/issues"
"Documentation" = "https://zeroemployeeorg.github.io/zeocore/"
"Changelog" = "https://github.com/zeroemployeeorg/zeocore/blob/main/CHANGELOG.md"

[tool.hatch.version]
path = "src/zeo_core/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/zeo_core"]

[tool.hatch.build.targets.sdist]
# Explicit excludes, not just a .gitignore mirror: hatchling's sdist
# target does not reliably defer to .gitignore, and this repo's own
# .gitignore only matches the literal ".venv/" name, not variant-named
# per-Python-version venvs (.venv310/, .venv311/, etc) that local
# multi-version testing creates. A stray venv's own symlinks (e.g.
# bin/python -> an absolute interpreter path) can make the sdist
# tarball fail to build/extract entirely, and a venv should never ship
# inside a source distribution regardless.
exclude = [
    ".venv*",
    "dist",
    ".pytest_cache",
    ".mypy_cache",
    ".ruff_cache",
    ".hypothesis",
    "*.egg-info",
]

[project.entry-points."zeo_core.modules"]
paths = "zeo_core.core.paths.plugin:create_plugin"
fs = "zeo_core.core.fs.plugin:create_plugin"
config = "zeo_core.config.plugin:create_plugin"
prompt = "zeo_core.prompt.plugin:create_plugin"

[project.entry-points."zeo_core.integrations"]
github = "zeo_core.integrations.github:create_integration"
"google.mail" = "zeo_core.integrations.google.mail:create_integration"
"google.drive" = "zeo_core.integrations.google.drive:create_integration"
"google.calendar" = "zeo_core.integrations.google.calendar:create_integration"
"google.docs" = "zeo_core.integrations.google.docs:create_integration"
"google.sheets" = "zeo_core.integrations.google.sheets:create_integration"
"google.slides" = "zeo_core.integrations.google.slides:create_integration"
pandoc = "zeo_core.integrations.pandoc:create_integration"
llms = "zeo_core.integrations.llms:create_integration"
ffmpeg = "zeo_core.integrations.ffmpeg:create_integration"
notion = "zeo_core.integrations.notion:create_integration"
supabase = "zeo_core.integrations.database.supabase:create_integration"
"hubspot.marketing" = "zeo_core.integrations.hubspot:create_integration"
"kit.marketing" = "zeo_core.integrations.kit:create_integration"
jupytext = "zeo_core.integrations.jupytext:create_integration"
"social.bluesky" = "zeo_core.integrations.social.bluesky:create_integration"
"revolut.business" = "zeo_core.integrations.revolut:create_integration"


[tool.isort]
profile = "black"
line_length = 88

[tool.ruff]
line-length = 88
target-version = "py314"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "C",   # flake8-comprehensions
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "N",   # pep8-naming
    "ANN", # flake8-annotations
    "S",   # flake8-bandit
    "A",   # flake8-builtins
]
# `target-version = "py313"` (the version floor bump) newly activates four
# pyupgrade rules that recommend PEP 695 / 3.12+ syntax the codebase does
# not use yet: UP040 (`type` statement for aliases), UP042 (`StrEnum` in
# place of `class X(str, Enum)`), UP046/UP047 (PEP 695 generic-class/
# -function type-parameter syntax in place of `Generic[T]` / a standalone
# TypeVar). These are real, ruff-detected modernization opportunities, not
# compatibility shims -- the opposite direction of what the floor bump
# removes. None are `--fix`-safe (StrEnum changes `__str__`/`__format__`
# behavior vs `str, Enum`; PEP 695 syntax is a semantic rewrite, not a
# no-op), so applying all 25 findings across 10 files is scoped OUT of the
# floor-bump change and left for a dedicated follow-up pass rather than
# done speculatively here. Ignored explicitly, not silently uncaught: a
# future `select` cleanup removes this block once that pass lands.
# `target-version = "py314"` (toolchain-floor-drift-20260901: ruff/black
# had been left at py313 when requires-python moved to >=3.14) newly
# activates one more: UP037 (drop now-unnecessary quotes from a forward-
# reference type annotation). 64 findings across 24 files in src/ and
# tests/. It IS `--fix`-safe, unlike the four above, but landing 64
# mechanical edits across 24 files is out of scope for a toolchain-config
# fix and belongs in its own reviewable pass -- same reasoning as the
# UP040/042/046/047 deferral above, added to the same ignore list rather
# than silently absorbed into this change.
ignore = ["UP037", "UP040", "UP042", "UP046", "UP047"]

[tool.ruff.lint.per-file-ignores]
"**/tests/**/*.py" = ["S101"]  # Disable S101 (assert warning) in test files
"src/zeo_core/integrations/google/drive/protocols.py" = ["N803"]  # N803: structurally types the real googleapiclient Resource object, whose fileId keyword we do not control -- monorepo RULING-233, ported as-is (still applies: same file, same third-party contract)
"tests/test_integrations/google/drive/mocks/*.py" = ["N803"]  # N803: subclasses/mocks protocols.py's real-API-matching Protocol, and live tests call fileId= as a keyword today -- monorepo RULING-233, ported as-is
"src/zeo_core/integrations/google/calendar/protocols.py" = ["N803"]  # N803: structurally types the real googleapiclient Calendar v3 Resource object, whose calendarId/eventId keywords we do not control -- same RULING-233 rationale as drive/protocols.py, calendarId/eventId are camelCase in the real API too
"tests/test_integrations/google/calendar/*.py" = ["N803"]  # N803: mocks call calendarId=/eventId= as keywords, matching the real googleapiclient Resource shape -- same RULING-233 rationale as the drive mocks equivalent

[tool.black]
line-length = 88
target-version = ["py314"]

[tool.mypy]
plugins = ["pydantic.mypy"]
python_version = "3.14"
# explicit_package_bases + mypy_path = "src": without this, mypy's CLI-target
# walk finds src/__init__.py (this repo has one, a hatch-build artifact of
# the flat src/ layout) and treats "src" as a package-name segment, naming
# these files "src.zeo_core.*" -- while the editable install's py.typed-
# driven site-packages route names the SAME files "zeo_core.*". Two module
# identities for one file aborts with "Source file found twice under
# different module names". Listing "src" as an explicit package base makes
# mypy's is_explicit_package_base check stop the walk AT src instead of
# folding it into the module name, so both routes agree on "zeo_core.*".
# Config-only fix (same mechanism as the monorepo's prior RULING-230 s4),
# ported without the monorepo's separate quack-core/ prefix since this
# repo's root already IS that directory.
explicit_package_bases = true
mypy_path = "src"
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_return_any = true
strict_optional = true

[[tool.mypy.overrides]]
# Ported from the monorepo root pyproject.toml (RULING-251 s1 / round19):
# googleapiclient and google_auth_oauthlib ship no py.typed marker and no
# bundled stubs, firing an identical import-untyped finding at every one of
# their import sites across the google integration's src and test trees.
# Scoped config fix, not N inline ignores and not a new stub-package
# dependency.
module = ["googleapiclient.*", "google_auth_oauthlib.*"]
ignore_missing_imports = true

[tool.coverage.run]
# Include the real host CLI and other supervised Python children.
patch = ["subprocess"]
parallel = true
source = ["zeo_core"]
omit = ["tests/*"]

[tool.coverage.report]
precision = 2
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
]

# Add pytest configuration
[tool.pytest.ini_options]
filterwarnings = [
    "error:coroutine .* was never awaited:RuntimeWarning",
    "error:Cell is missing an id field:nbformat.warnings.MissingIDFieldWarning",
]
markers = [
    "integration: marks tests as integration tests (may require external services)",
    "slow: marks tests as slow (may take longer to run)",
    "e2e: marks tests as end-to-end tests (testing complete workflows)",
    "unit: marks tests as unit tests",
    "smoke: marks tests as smoke tests (basic functionality tests)"
]

[dependency-groups]
documentation = [
    "mkdocs==1.6.1",
    "mkdocs-material==9.7.7",
    "mkdocstrings-python==2.0.8",
]
